<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ぴっこん 表情プレビュー</title>
  <style>
    :root {
      color: #3f3025;
      background: #f4faf8;
      font-family: system-ui, sans-serif;
    }
    body { margin: 24px; }
    h1 { font-size: 24px; }
    h2 { margin-top: 28px; font-size: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; }
    figure { margin: 0; text-align: center; }
    .tile {
      display: grid;
      place-items: center;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e7efec 25%, transparent 25%),
        linear-gradient(-45deg, #e7efec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e7efec 75%),
        linear-gradient(-45deg, transparent 75%, #e7efec 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      border: 1px solid #9eb8b0;
      border-radius: 12px;
    }
    .large,
    .large img { width: 160px; height: 160px; }
    .small,
    .small img { width: 56px; height: 56px; }
    figcaption { margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>ぴっこん 表情プレビュー</h1>
    <h2>160px</h2>
    <div class="row">
      <figure><div class="tile large"><img src="pikkon-happy.svg" alt="穏やかに笑うぴっこん"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile large"><img src="pikkon-happy-talk.svg" alt="穏やかに話すぴっこん"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile large"><img src="pikkon-excited.svg" alt="両方のひれを上げて喜ぶぴっこん"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile large"><img src="pikkon-excited-talk.svg" alt="両方のひれを上げて喜んで話すぴっこん"></div><figcaption>excited-talk</figcaption></figure>
    </div>
    <h2>56px</h2>
    <div class="row">
      <figure><div class="tile small"><img src="pikkon-happy.svg" alt="穏やかに笑うぴっこん、56px"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile small"><img src="pikkon-happy-talk.svg" alt="穏やかに話すぴっこん、56px"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile small"><img src="pikkon-excited.svg" alt="喜ぶぴっこん、56px"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile small"><img src="pikkon-excited-talk.svg" alt="喜んで話すぴっこん、56px"></div><figcaption>excited-talk</figcaption></figure>
    </div>
  </main>
</body>
</html>
