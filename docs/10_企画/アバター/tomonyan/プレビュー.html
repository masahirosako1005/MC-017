<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ともにゃん 表情プレビュー</title>
  <style>
    :root {
      color: #3f3327;
      background: #fffaf0;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 24px;
    }
    h1,
    h2 {
      margin-block: 0 16px;
    }
    h2 {
      margin-top: 32px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: end;
    }
    figure {
      margin: 0;
      text-align: center;
    }
    .tile {
      display: grid;
      place-items: center;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #f2eee6 25%, transparent 25%),
        linear-gradient(-45deg, #f2eee6 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #f2eee6 75%),
        linear-gradient(-45deg, transparent 75%, #f2eee6 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      border: 1px solid #cbbda9;
      border-radius: 12px;
    }
    .large,
    .large img {
      width: 160px;
      height: 160px;
    }
    .small,
    .small img {
      width: 56px;
      height: 56px;
    }
    figcaption {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ともにゃん 表情プレビュー</h1>
    <h2>160px</h2>
    <div class="row">
      <figure><div class="tile large"><img src="tomonyan-happy.svg" alt="穏やかに笑うともにゃん"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile large"><img src="tomonyan-happy-talk.svg" alt="穏やかに話すともにゃん"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile large"><img src="tomonyan-excited.svg" alt="ちょうちんと片手を上げて喜ぶともにゃん"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile large"><img src="tomonyan-excited-talk.svg" alt="ちょうちんと片手を上げて喜んで話すともにゃん"></div><figcaption>excited-talk</figcaption></figure>
    </div>
    <h2>56px</h2>
    <div class="row">
      <figure><div class="tile small"><img src="tomonyan-happy.svg" alt="穏やかに笑うともにゃん、56px"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile small"><img src="tomonyan-happy-talk.svg" alt="穏やかに話すともにゃん、56px"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile small"><img src="tomonyan-excited.svg" alt="喜ぶともにゃん、56px"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile small"><img src="tomonyan-excited-talk.svg" alt="喜んで話すともにゃん、56px"></div><figcaption>excited-talk</figcaption></figure>
    </div>
  </main>
</body>
</html>
