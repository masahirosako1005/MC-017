<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ほしろう 表情プレビュー</title>
  <style>
    :root { color: #243052; background: #f7f3e8; font-family: sans-serif; }
    body { margin: 24px; }
    h1 { font-size: 24px; }
    h2 { margin-top: 28px; font-size: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: end; }
    figure { margin: 0; text-align: center; }
    .tile {
      display: grid;
      place-items: center;
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
      border: 1px solid #a9adc0;
      border-radius: 12px;
    }
    .large { width: 160px; height: 160px; }
    .large img { width: 160px; height: 160px; }
    .small { width: 56px; height: 56px; }
    .small img { width: 56px; height: 56px; }
    figcaption { margin-top: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>ほしろう 表情プレビュー</h1>
    <h2>160px</h2>
    <div class="row">
      <figure><div class="tile large"><img src="hoshirou-happy.svg?v=4" alt="笑顔のほしろう"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile large"><img src="hoshirou-happy-talk.svg?v=4" alt="笑顔で話すほしろう"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile large"><img src="hoshirou-excited.svg?v=4" alt="大喜びのほしろう"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile large"><img src="hoshirou-excited-talk.svg?v=4" alt="大喜びで話すほしろう"></div><figcaption>excited-talk</figcaption></figure>
    </div>
    <h2>56px</h2>
    <div class="row">
      <figure><div class="tile small"><img src="hoshirou-happy.svg?v=4" alt="笑顔のほしろう"></div><figcaption>happy</figcaption></figure>
      <figure><div class="tile small"><img src="hoshirou-happy-talk.svg?v=4" alt="笑顔で話すほしろう"></div><figcaption>happy-talk</figcaption></figure>
      <figure><div class="tile small"><img src="hoshirou-excited.svg?v=4" alt="大喜びのほしろう"></div><figcaption>excited</figcaption></figure>
      <figure><div class="tile small"><img src="hoshirou-excited-talk.svg?v=4" alt="大喜びで話すほしろう"></div><figcaption>excited-talk</figcaption></figure>
    </div>
  </main>
</body>
</html>
